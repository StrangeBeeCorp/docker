# TheHive Flow configuration
#
# Secrets are NOT stored in this file. They are read from /secret (mounted from
# ./thehive-flow/secret/) and from BEEFLOW_SECRET_* environment variables set in
# docker-compose.yml. Any value below can be overridden with an environment
# variable: prefix BEEFLOW_, double underscore between levels
# (e.g. BEEFLOW_API__PUBLIC__URL).

secret_path: /secret

temporal:
  addr: temporal:7233

database:
  postgres:
    connection_string: postgres://thehive_flow:${FLOW_DB_PASSWORD}@postgresql:5432/thehive_flow?sslmode=disable

blobstore:
  backend: s3
  s3:
    # Bundled SeaweedFS; the bucket is created by init-s3-store before TheHive Flow starts.
    # Credentials are injected from .env by docker-compose.yml.
    endpoint: http://s3-store:8333
    bucket: thehive-flow
    # Required by the S3 client for request signing, ignored by SeaweedFS
    region: us-east-1
    use_path_style: true

api:
  public:
    enable: true
    addr: "0.0.0.0:8081"
    jwt:
      # Shared with TheHive (TH_ORCHESTRATOR_KEY); set by BEEFLOW_SECRET_JWT_SYMMETRIC_KEY
      secret: ""

modules:
  observability:
    # /livez and /readyz
    listener:
      addr: "0.0.0.0:9090"
    metrics:
      prometheus:
        enabled: true
    pprof:
      enabled: false
  runs:
    # This stack owns its Temporal namespace: keep its retention aligned with runs retention
    sync_temporal_retention: true
  workers:
    workflows:
      max_concurrent_workflow_task_pollers: 32
    activities:
      max_concurrent_activity_task_pollers: 32
      # Outbound connections to non-public addresses (loopback, RFC 1918, link-local, ...)
      # are blocked. To reach TheHive, Cortex or another service on a private network,
      # allowlist its CIDR range. A bare IP without prefix fails startup.
      # egress:
      #   allowlist:
      #     - 192.168.1.0/24
      #     - 192.168.1.10/32
      thehive:
        # TheHive URL reachable from this stack (FLOW_THEHIVE_URL in .env)
        url: ${FLOW_THEHIVE_URL}
        # File name inside /secret, used when BEEFLOW_SECRET_THEHIVE_API_KEY is empty
        api_key: thehive-api-key
