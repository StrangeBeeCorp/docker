name: Renovate

# Self-hosted Renovate runner. Renovate reads renovate.json at the repo root and
# opens PRs that bump the TheHive / Cortex tags pinned in versions.env.
#
# Requires a repository secret RENOVATE_TOKEN — a PAT (classic: `repo` scope, or
# fine-grained: Contents RW + Pull requests RW + Issues RW for the Dependency
# Dashboard). A PAT is mandatory for self-hosted Renovate, and unlike the default
# GITHUB_TOKEN, PRs it opens WILL trigger any future validation workflows.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily — the single source of cadence
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level (debug for troubleshooting)
        required: false
        default: info
        type: choice
        options: [debug, info, warn, error]

# Only one Renovate run at a time; never cancel an in-flight run mid-PR.
concurrency:
  group: renovate
  cancel-in-progress: false

# Renovate authenticates via RENOVATE_TOKEN, so the workflow token only needs
# read access for actions/checkout.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@316d7cd859606d6039a2182b7d69199e9b036835 # v46.2.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # Scope this self-hosted run to just this repo (no org autodiscovery).
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
