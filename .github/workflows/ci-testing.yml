name: CI - testing stack

# Installs the testing/ all-in-one stack the same way an operator would
# (scripts/init.sh + docker compose) on a fresh runner, waits for every service
# to become healthy, then runs the smoke + object-storage tests against it.

on:
  push:
    branches: [main]        # post-merge run only; PRs cover feature branches
    paths:
      - 'testing/**'
      - 'versions.env'
      - '.github/workflows/ci-testing.yml'
  pull_request:
    paths:
      - 'testing/**'
      - 'versions.env'
      - '.github/workflows/ci-testing.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testing-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: testing
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialise the stack (non-interactive)
        # init.sh and check_permissions.sh are interactive (a "fix permissions?"
        # prompt, then a hostname prompt). Pipe `yes` so every prompt is answered
        # 'y' from an infinite stream -> no read can ever block the runner.
        # Side effect: the hostname becomes 'y', which is harmless here -- nginx is
        # a catch-all server block and the tests hit 127.0.0.1 directly.
        run: yes | bash ./scripts/init.sh

      - name: Start the stack (gated on health)
        run: docker compose up -d --wait --wait-timeout 600

      - name: Smoke test (org / user / case / alert workflow)
        run: bash ./tests/smoke.sh

      - name: Object-storage test (attachment SHA256 round-trip)
        run: bash ./tests/storage.sh

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-stack-logs
          path: testing/compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
