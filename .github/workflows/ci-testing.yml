name: testing stack

on:
  push:
    branches: [main]
    paths:
      - 'testing/**'
      - 'versions.env'
      - '.github/workflows/ci-testing.yml'
  pull_request:
    paths:
      - 'testing/**'
      - 'versions.env'
      - '.github/workflows/ci-testing.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-testing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testing-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: testing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise the stack (non-interactive)
        run: bash ./scripts/init.sh --yes

      - name: Start the stack (gated on health)
        run: docker compose up -d --wait --wait-timeout 600

      # Debug: images and versions actually run, and the state of each service, also when the start fails
      - name: Show running images and state
        if: always()
        run: |
          docker compose images
          echo
          docker compose ps -a --format 'table {{.Service}}\t{{.Image}}\t{{.State}}\t{{.Status}}'

      # TheHive Flow has no container healthcheck (distroless image): poll its readiness endpoint
      - name: TheHive Flow readiness
        run: |
          for i in $(seq 1 150); do
            curl -fsS http://127.0.0.1:9090/readyz && exit 0
            sleep 1
          done
          echo "TheHive Flow is not ready"
          exit 1

      - name: TheHive Flow connection test (connector, JWT authentication)
        run: bash ./tests/flow.sh

      - name: Smoke test (org / user / case / alert workflow)
        run: bash ./tests/smoke.sh

      - name: Object-storage test (attachment SHA256 round-trip)
        run: bash ./tests/storage.sh

      - name: Cortex analyzer test (job run through the Docker socket)
        run: bash ./tests/cortex.sh

      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps > compose-logs.txt 2>&1 || true

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testing-stack-logs
          path: testing/compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
