name: static checks

on:
  push:
    branches: [main]
    paths:
      - '**/docker-compose.yml'
      - '**/scripts/**'
      - '**/tests/**'
      - 'versions.env'
      - 'ci/lint.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    paths:
      - '**/docker-compose.yml'
      - '**/scripts/**'
      - '**/tests/**'
      - 'versions.env'
      - 'ci/lint.sh'
      - '.github/workflows/lint.yml'
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ci/lint.sh
        run: bash ci/lint.sh
